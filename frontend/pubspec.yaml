name: ai_expense_analyzer
description: "AI-powered Personal Finance Management Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.6
  
  # Networking
  http: ^1.6.0
  
  # Local Storage
  shared_preferences: ^2.5.5
  
  # State Management
  provider: ^6.1.5+1
  
  # Charts & Graphs
  fl_chart: ^1.2.0
  
  # SVG Support
  flutter_svg: ^2.3.0
  
  # Image Picker
  image_picker: ^1.2.3
  
  # Date Formatting
  intl: ^0.20.3
  
  # URL Launcher
  url_launcher: ^6.3.2
  
  # File Storage
  path_provider: ^2.0.15
  
  # UUID Generation
  uuid: ^4.0.0
  
  # Logging
  logger: ^1.4.0
  
  # Animations
  animations: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^3.0.1
  
  # Splash Screen
  flutter_native_splash: ^2.3.3
  
  # App Icons
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  
  